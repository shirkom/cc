# Agent-on-Postgres lab: n8n (agents) + PostgreSQL 16 (the system under study).
#   cp .env.example .env   # add your LLM API key
#   docker compose up -d
#   scripts/setup_n8n.sh   # import credentials + workflows
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lab_admin
      POSTGRES_PASSWORD: lab_admin_pw
      POSTGRES_DB: shop
    command:
      - postgres
      # Statistics per normalized statement.
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - compute_query_id=on
      # Log every statement, error, connection and lock wait as CSV so it can be
      # loaded back into a table (analysis/load_logs.sql).
      - -c
      - logging_collector=on
      - -c
      - log_destination=csvlog
      - -c
      - log_directory=/var/log/postgresql/lab
      - -c
      - log_statement=all
      - -c
      - log_min_error_statement=error
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=500ms
      - -c
      - log_temp_files=0
      - -c
      - track_io_timing=on
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pglogs:/var/log/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./analysis:/lab/analysis:ro
      - ./results:/lab/results:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab_admin -d shop"]
      interval: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.6}
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-local-lab-key}
      GENERIC_TIMEZONE: UTC
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      # Many agent runs at once.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "-1"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/lab/n8n:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  pglogs:
  n8n_data:
